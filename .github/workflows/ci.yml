name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DITL_TOKEN: ci-local-dry-run-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm check:csp
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      # Lighthouse budgets against the prerendered build, on the runner's system Chrome.
      - run: pnpm lhci
      # Visual baselines are rendered in the Playwright image, so they are compared there too.
      - name: Visual regression (Playwright container)
        run: bash scripts/visual-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-ci
          path: |
            playwright-report
            playwright-report-visual
          retention-days: 7
