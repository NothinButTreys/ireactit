name: deploy-check
on: deployment_status
permissions:
  contents: read
jobs:
  deploy-check:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    concurrency:
      group: deploy-check-${{ github.event.deployment.id }}
      cancel-in-progress: true
    env:
      BASE_URL: ${{ github.event.deployment_status.target_url }}
      DITL_TOKEN: ${{ secrets.DITL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      DEPLOY_ENV: ${{ github.event.deployment.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run against deployment
        run: |
          echo "Testing $DEPLOY_ENV deployment at $BASE_URL"
          if [ "$DEPLOY_ENV" = "Production" ]; then
            pnpm e2e:ditl
          else
            pnpm exec playwright test tests/e2e tests/ditl tests/visual
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-deploy
          path: playwright-report
          retention-days: 7
