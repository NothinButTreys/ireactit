name: deploy-check
on: deployment_status
permissions:
  contents: read
jobs:
  deploy-check:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-check-${{ github.event.deployment.id }}
      cancel-in-progress: true
    env:
      BASE_URL: ${{ github.event.deployment_status.target_url }}
      DITL_TOKEN: ${{ secrets.DITL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      DEPLOY_ENV: ${{ github.event.deployment.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run against deployment
        run: |
          echo "Testing $DEPLOY_ENV deployment at $BASE_URL"
          if [ "$DEPLOY_ENV" = "Production" ]; then
            pnpm e2e:ditl
          else
            pnpm exec playwright test tests/e2e tests/ditl
          fi
      # Visual baselines are rendered in the Playwright image, so they are compared there too.
      - name: Visual regression against deployment (Playwright container)
        if: github.event.deployment.environment != 'Production'
        run: bash scripts/visual-run.sh
      # Belt and braces: playwright.config.ts turns traces off against deployments because they record the bypass
      # secret and DITL token headers verbatim. Strip any trace zips anyway before a report leaves this public repo;
      # HTML error text and screenshots stay (screenshots can't show headers). sudo: the visual container writes as root.
      - name: Strip traces from reports
        id: strip-traces
        if: failure()
        run: |
          for d in playwright-report playwright-report-visual; do
            if [ -d "$d" ]; then sudo find "$d" -name '*.zip' -delete; fi
          done
          if sudo find playwright-report* -name '*.zip' 2>/dev/null | grep -q .; then echo "trace zips remain" >&2; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.strip-traces.outcome == 'success'
        with:
          name: playwright-report-deploy
          path: |
            playwright-report
            playwright-report-visual
          retention-days: 7
