name: deploy-check
on: deployment_status
permissions:
  contents: read
jobs:
  deploy-check:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-check-${{ github.event.deployment.id }}
      cancel-in-progress: true
    env:
      BASE_URL: ${{ github.event.deployment_status.target_url }}
      DITL_TOKEN: ${{ secrets.DITL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      DEPLOY_ENV: ${{ github.event.deployment.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run against deployment
        run: |
          echo "Testing $DEPLOY_ENV deployment at $BASE_URL"
          if [ "$DEPLOY_ENV" = "Production" ]; then
            pnpm e2e:ditl
          else
            pnpm exec playwright test tests/e2e tests/ditl
          fi
      # Visual baselines are rendered in the Playwright image, so they are compared there too.
      - name: Visual regression against deployment (Playwright container)
        if: github.event.deployment.environment != 'Production'
        run: bash scripts/visual-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-deploy
          path: |
            playwright-report
            playwright-report-visual
          retention-days: 7
